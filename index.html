<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CENSO 2026 - Ejido San Antonio</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#001e3c">

    <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/a/AVvXsEh-ZheEI0cHt3lE1ekUOIIT9uMXZ1XAUaxaMhtBvfQUQ_EQ82-AfkqSFdcXWZ8RkkPQzVSj5nRwW7mxVmpKYCfRfNZE_jppok92a-YQOEsTSIB03ANBvqDri0Jc_iFScPdsH_MO-hx64FbOOKW1ZPFVj_6GFDaR6UP74zwUFeHEGUyrpukcSdzBJ7u8NOLq">
    
    <link rel="manifest" href="manifest.json">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #001e3c; 
            font-family: sans-serif;
        }
        
        #frameApp { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            z-index: 10;
        }

        #loaderPWA {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #001e3c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loaderPWA">
        <div class="spinner"></div>
        <p style="font-size: 14px; opacity: 0.8; letter-spacing: 1px;">CARGANDO CENSO 2026...</p>
    </div>

    <iframe id="frameApp" allow="camera; microphone; geolocation" src=""></iframe>

    <script>
        // URL Base de tu WebApp de Google Apps Script
        const URL_BASE_APPSCRIPT = "https://script.google.com/macros/s/AKfycbzPm-2A8NqelYS7wiNzlKETn3k4244N7boMbeu6NGDfNVkkQxyy3QLZz84mLgJmduMYjQ/exec";

        // Leer todos los parámetros de la URL actual (ej: ?p=Buscador, ?p=Agregar, etc.)
        const currentParams = window.location.search;
        const iframe = document.getElementById('frameApp');
        const loader = document.getElementById('loaderPWA');

        // Construir la URL de destino traspasando los parámetros
        const targetUrl = URL_BASE_APPSCRIPT + (currentParams ? currentParams : "");
        iframe.src = targetUrl;

        // Ocultar pantalla de carga cuando el iframe termine de cargar
        iframe.onload = function() {
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
            }
        };

        // Registro del Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('PWA: Service Worker registrado'))
                    .catch(err => console.log('PWA Error:', err));
            });
        }
    </script>
</body>
</html>
